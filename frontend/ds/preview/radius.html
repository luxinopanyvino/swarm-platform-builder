<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Corner radius" subtitle="SLDS2 rounded set" viewport="700x185" --><html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>
  .grid { display:flex; gap:20px; align-items:flex-end; }
  .item { text-align:center; }
  .box { width:74px; height:74px; background:#fff; border:1.5px solid var(--blue-60); box-shadow: var(--shadow-1); }
  .item b { display:block; font-size:12px; color:var(--ink-100); margin-top:8px; }
  .item .mono { font-size:10px; color:var(--text-muted); }
</style></head>
<body>
  <div class="cap" style="margin-bottom:16px;">Corner radius · SLDS2 (rounder)</div>
  <div class="grid">
    <div class="item"><div class="box" style="border-radius:4px;"></div><b>sm</b><span class="mono">4px</span></div>
    <div class="item"><div class="box" style="border-radius:8px;"></div><b>md</b><span class="mono">8px</span></div>
    <div class="item"><div class="box" style="border-radius:12px;"></div><b>lg</b><span class="mono">12px</span></div>
    <div class="item"><div class="box" style="border-radius:16px;"></div><b>xl</b><span class="mono">16px</span></div>
    <div class="item"><div class="box" style="border-radius:999px; width:74px;"></div><b>pill</b><span class="mono">999px</span></div>
  </div>
</body></html>
