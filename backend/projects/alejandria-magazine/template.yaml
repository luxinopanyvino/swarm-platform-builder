# Plantilla de proyecto — esquema v1 (SPEC-013 / T8.4 / AC4, ADR-0005).
#
# Este fichero es la definición **completa** de AlejandrIA Magazine: qué agentes
# tiene, qué capacidades compone cada uno, en qué orden corren y dónde vuelve el
# bucle de revisión. Hasta T8.3 todo esto vivía en código (primero dentro del
# orquestador, después en `modules/agents/domain/alejandria.py`); aquí deja de ser
# código y pasa a ser el dato que el motor lee.
#
# Es lo que hace posible un proyecto nuevo sin tocar Python: copiar este
# directorio, cambiar los agentes y el grafo.
version: 1
slug: alejandria-magazine
name: AlejandrIA Magazine
description: >-
  Revista científica con flujo editorial completo: investigación con RAG,
  redacción, revisión por pares con bucle de corrección, formato académico y
  publicación.
use_case_type: alejandria_magazine

# ── Agentes ─────────────────────────────────────────────────────────────────
# `requires` nombra capacidades del registro del motor. El *loader* comprueba
# que existan al cargar la plantilla: un proyecto al que le falta una capacidad
# tiene que enterarse al arrancar y no a mitad del tercer agente.
#
# `profile` es el `.agent.md` que se clona a la base de datos al crear un
# proyecto desde esta plantilla; ahí es donde la persona usuaria lo edita.
agents:
  - name: investigador
    entrypoint: app.modules.agents.adapters.investigador:run_investigador
    # `rag_results` y no `rag`: construye citas, así que necesita los metadatos
    # de cada fuente y no un bloque de texto.
    requires: [rag_results, llm]
    profile: agents/investigador.agent.md
    description: Busca fuentes en la base de conocimiento y sintetiza el material.

  - name: redactor
    entrypoint: app.modules.agents.adapters.redactor:run_redactor
    requires: [rag, llm, llm_stream]
    profile: agents/redactor.agent.md
    description: Escribe el borrador a partir de la investigación y del feedback.

  - name: revisor
    entrypoint: app.modules.agents.adapters.revisor:run_revisor
    requires: [llm]
    profile: agents/revisor.agent.md
    description: Evalúa el borrador y decide si vuelve al redactor.

  - name: formateador
    entrypoint: app.modules.agents.adapters.formateador:run_formateador
    requires: [llm]
    profile: agents/formateador.agent.md
    description: Aplica el formato científico y construye las referencias.

  - name: publicador
    entrypoint: app.modules.agents.adapters.publicador:run_publicador
    requires: [format]
    profile: agents/publicador.agent.md
    description: Persiste el artículo final y genera la maquetación imprimible.

# ── Grafo ───────────────────────────────────────────────────────────────────
graph:
  sequence: [investigador, redactor, revisor, formateador, publicador]
  review_loops:
    # El bucle editorial. `threshold` y `max_loops` son de este proyecto: otro
    # puede exigir 90 y dar una sola vuelta, o no tener revisión.
    - reviewer: revisor
      on_reject: redactor
      threshold: 80
      max_loops: 3
      # Agotadas las vueltas sin aprobar, la ejecución se detiene y el artículo pasa a
      # `requires_human_review` (SPEC-032/AC7): no se formatea ni se publica lo que el
      # revisor no aprobó. Solo una persona sale de ahí (reejecutar o rechazar).
      on_exhausted: stop
      # A dónde volver cuando alguien sube una fuente nueva. Al investigador si
      # está en el flujo, para que la fuente entre en la investigación y en las
      # citas; si no, al redactor, que al menos la usará como contexto.
      retry_targets: [investigador, redactor]

  # Reglas del Flow Designer (VAL-004). Las valida el backend al guardar un flujo
  # y al ejecutarlo, y el lienzo las aplica para avisar mientras se dibuja.
  # «Antes» es el orden de ejecución: el de las aristas y, donde no hay arista que
  # lo decida, el orden en que se soltaron los agentes en el lienzo.
  # Los ciclos y las autoconexiones siempre bloquean; no son configurables.
  flow_rules:
    orphans: warning        # un agente sin ninguna conexión en un flujo de varios
    requires:
      # No se publica lo que nadie ha escrito. Un artículo que ya tiene cuerpo sí
      # puede re-publicarse sin redactor en el flujo.
      - agent: publicador
        any_of: [redactor]
        severity: error
        satisfied_by_existing_output: true
      # Publicar sin pasar por revisión o formato es posible, pero no lo normal.
      - agent: publicador
        any_of: [formateador, revisor]
        severity: warning

# ── Compuerta de publicación (SPEC-032, ADR-0011) ───────────────────────────
# Comprobaciones deterministas, sin LLM, sobre el texto final tras el Formateador.
# Falla cerrada: lo que no se puede comprobar (`not_verified`) bloquea. Los criterios
# de `pending` aún no tienen dato: no bloquean y el informe los lista como pendientes.
# Se valida al cargar la plantilla (platform/publication_gate/config.py).
gate:
  placeholders:
    - "(Author, Year)"
    - "(Autor, Año)"
    - "(Author et al., Year)"
    - "[?]"
    - "[??]"
    - "[citation needed]"
    - "[cita necesaria]"
    - "TODO"
    - "TBD"
    - "XXX"
  references:
    title_similarity: 0.90     # similitud mínima del título con el registro
    other_authors_ratio: 0.5   # fracción de los demás autores que debe coincidir
    timeout_s: 10              # por consulta a Crossref/OpenAlex
    retries: 2                 # con espera exponencial
    backoff_s: 1.0
    max_total_s: 120           # por evaluación
    cache_ttl_days: 30         # solo se cachean los positivos
  structure:
    sections: [introduction, methods, results, discussion, references]
    titles:
      es:
        introduction: [Introducción]
        methods: [Métodos, Metodología]
        results: [Resultados]
        discussion: [Discusión]
        references: [Referencias, Bibliografía]
      en:
        introduction: [Introduction]
        methods: [Methods, Methodology, Materials and Methods]
        results: [Results]
        discussion: [Discussion]
        references: [References, Bibliography]
  pending:
    - {id: V01, phase: "Fase 4 (4.2)"}
    - {id: V05, phase: "Fase 4 (4.3)"}
    - {id: V06, phase: "Fase 4"}
    - {id: V07, phase: "Fase 4 (4.1, 4.9)"}
    - {id: V08, phase: "Fase 4"}
    - {id: V12, phase: "Fase 5 (5.1)"}
    - {id: V13, phase: "Fase 5 (5.2)"}
    - {id: V14, phase: "Fase 5 (5.3)"}
    - {id: V16, phase: "Fase 5 (5.4)"}
  # A qué agente se devuelve el manuscrito cuando un criterio bloquea (AC14). La
  # devolución automática es de la Fase 2: hoy lo informa y una persona reejecuta.
  responsible:
    reference_existence: investigador
    reference_structure: investigador
    placeholders: redactor
    imrad_structure: redactor
