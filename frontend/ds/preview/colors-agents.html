<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Agent palette" subtitle="The five editorial agents" viewport="700x200" --><html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>
  .agents { display:grid; grid-template-columns: repeat(5,1fr); gap:12px; text-align:center; }
  .dot { width:40px; height:40px; border-radius:12px; margin:0 auto 8px; display:flex; align-items:center; justify-content:center; }
  .agents b { font-size:12px; color:var(--ink-100); display:block; }
  .agents .mono { font-size:9px; color:var(--text-muted); }
</style></head>
<body>
  <div class="cap" style="margin-bottom:14px;">Agent palette · the five editorial agents</div>
  <div class="agents">
    <div><div class="dot" style="background:#e6f6fc;"><span style="width:16px;height:16px;border-radius:5px;background:#0d9dda;"></span></div><b>Investigador</b><span class="mono">#0D9DDA</span></div>
    <div><div class="dot" style="background:#f1eefe;"><span style="width:16px;height:16px;border-radius:5px;background:#6b4fe3;"></span></div><b>Redactor</b><span class="mono">#6B4FE3</span></div>
    <div><div class="dot" style="background:#fdf3e3;"><span style="width:16px;height:16px;border-radius:5px;background:#c47d04;"></span></div><b>Revisor</b><span class="mono">#C47D04</span></div>
    <div><div class="dot" style="background:#ebf7ee;"><span style="width:16px;height:16px;border-radius:5px;background:#2e844a;"></span></div><b>Formateador</b><span class="mono">#2E844A</span></div>
    <div><div class="dot" style="background:#fdeeec;"><span style="width:16px;height:16px;border-radius:5px;background:#cb4b3f;"></span></div><b>Publicador</b><span class="mono">#CB4B3F</span></div>
  </div>
  <div class="lbl" style="margin-top:14px;">Each agent owns a hue used on its flow node, badge, and execution step. Tints (05) back chips; full value for the mark.</div>
</body></html>
