app:
  name: AlejandrIA Magazine
  version: 0.2.0
  debug: true
llm:
  # Motor agéntico por defecto: Claude (Anthropic) — SPEC-023 / ADR-0009.
  # Cambia a 'ollama' (on-prem local) o 'openai' (compatible: vLLM/LM Studio) para
  # soberanía de datos. La variable de entorno LLM_PROVIDER tiene mayor prioridad.
  provider: anthropic
ollama:
  base_url: http://localhost:11434
  default_model: mistral:7b
  embed_model: nomic-embed-text
openai:
  api_key: ''
  model: gpt-4o-mini
  embed_model: text-embedding-3-small
  base_url: null
anthropic:
  # Motor por defecto. La API key NO se versiona: inyéctala con ANTHROPIC_API_KEY
  # (env, mayor prioridad). Su ausencia no aborta el arranque; la primera llamada
  # al LLM falla (error perezoso). Anthropic no ofrece embeddings: el RAG sigue
  # en ollama/openai aunque la generación sea Claude.
  api_key: ''
  model: claude-opus-5        # default global; el modelo por agente llega en T12.3
  base_url: null              # gateway/proxy opcional; null = endpoint oficial
  max_tokens: 4096
database:
  url: sqlite+aiosqlite:///./data/dev.db
security:
  secret_key: CAMBIA-ESTO-EN-PRODUCCION-usa-openssl-rand-hex-32
  algorithm: HS256
  access_token_expire_minutes: 30
  refresh_token_expire_days: 7
  # Brute-force / credential-stuffing protection for /auth/login y /auth/register.
  # Rate limit por IP (ventana deslizante) + bloqueo temporal de cuenta tras
  # varios intentos fallidos consecutivos. Pon max=0 para deshabilitar cada uno.
  auth_ratelimit_max_attempts: 10      # intentos por ventana y por IP (0 = off)
  auth_ratelimit_window_seconds: 60    # longitud de la ventana, en segundos
  auth_lockout_max_failed: 5           # fallos consecutivos antes de bloquear (0 = off)
  auth_lockout_seconds: 900            # duración del bloqueo de cuenta (15 min)
access_control:
  # Secure by default: dev-only role promotion shortcut stays OFF.
  # Enable explicitly (and only) in local development.
  enable_dev_role_promotion: false
  # Role assigned on self-registration. Minimal privilege: lector | publico.
  default_signup_role: lector
qdrant:
  url: http://localhost:6333
  api_key: null
  collection: rag_docs
  vector_size: 768
rag:
  chunk_size: 800
  chunk_overlap: 80
  top_k: 6
  score_threshold: 0.5
agents:
  investigador:
    model: null
    temperature: 0.3
    rag_enabled: true
    rag_collection: rag_docs
    rag_top_k: 6
    rag_chunk_size: 800
    semantic_rerank: true
  redactor:
    model: qwen3.6:latest
    temperature: 0.7
    rag_enabled: false
  revisor:
    model: llama3.2:3b
    temperature: 0.2
    rag_enabled: false
  formateador:
    model: llama3.2:1b
    temperature: 0.4
    rag_enabled: false
  publicador:
    model: llama3.2:1b
    rag_enabled: false
