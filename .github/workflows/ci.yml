name: CI

# Gate de integración: materializa GOVERNANCE §4–6 (tests, build, specs, secretos).
# Todo PR a develop debe pasar este workflow (configurar branch protection aparte).
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

# Cancela ejecuciones previas del mismo ref si llega un push nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # La validación de config exige DEBUG o un SECRET_KEY no inseguro.
      # Los tests fijan su propio DATABASE_URL (sqlite) en tiempo de import.
      DEBUG: "true"
      SECRET_KEY: "ci-secret-not-for-prod"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Ejecutar tests
        run: python -m pytest -q

  frontend-build:
    name: Frontend · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Build
        run: npm run build

  specs-validate:
    name: SDD · validar specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pyyaml>=6.0.1"
      - name: Validar bloques sdd-sync
        run: python scripts/validate_specs.py

  secret-scan:
    name: Seguridad · gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Escanear secretos en el árbol de trabajo
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 \
            detect --source /repo --no-git --redact -v \
            --config /repo/.gitleaks.toml
