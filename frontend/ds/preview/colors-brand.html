<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Alexandria Blue" subtitle="Primary brand ramp" viewport="700x215" --><html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>
  .ramp { display: grid; grid-template-columns: repeat(9, 1fr); border-radius: 10px; overflow: hidden; border: 1px solid var(--border-default); }
  .sw { height: 64px; display: flex; align-items: flex-end; padding: 6px; }
  .sw span { font-family: var(--font-mono); font-size: 9px; }
  .big { display:flex; align-items:center; gap:14px; margin-top:16px; }
  .chip { width:54px; height:54px; border-radius:10px; box-shadow: var(--shadow-1); }
</style></head>
<body>
  <div class="cap" style="margin-bottom:12px;">Alexandria Blue · primary brand ramp</div>
  <div class="ramp">
    <div class="sw" style="background:#eaf4ff;"><span style="color:#0b1b33;">05</span></div>
    <div class="sw" style="background:#d6eaff;"><span style="color:#0b1b33;">10</span></div>
    <div class="sw" style="background:#aad5fb;"><span style="color:#0b1b33;">20</span></div>
    <div class="sw" style="background:#4ea0ee;"><span style="color:#fff;">40</span></div>
    <div class="sw" style="background:#1b96ff;"><span style="color:#fff;">50</span></div>
    <div class="sw" style="background:#0176d3;"><span style="color:#fff;">60</span></div>
    <div class="sw" style="background:#005fb2;"><span style="color:#fff;">70</span></div>
    <div class="sw" style="background:#014486;"><span style="color:#fff;">80</span></div>
    <div class="sw" style="background:#022a52;"><span style="color:#fff;">95</span></div>
  </div>
  <div class="big">
    <div class="chip" style="background:#0176d3;"></div>
    <div class="col"><strong style="color:var(--ink-100); font-size:15px;">Primary · #0176D3</strong><span class="lbl">Actions, links, focus, selection. Hover #005FB2, active #014486.</span></div>
  </div>
</body></html>
