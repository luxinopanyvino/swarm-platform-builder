<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>
  .grp { display:flex; gap:30px; flex-wrap:wrap; }
  .col2 { display:flex; flex-direction:column; gap:12px; }
  .opt { display:flex; align-items:center; gap:9px; font-size:13px; color:var(--ink-90); }
  .cbx { width:18px; height:18px; border-radius:5px; border:1.5px solid var(--border-strong); display:flex; align-items:center; justify-content:center; }
  .cbx.on { background:var(--brand); border-color:var(--brand); }
  .cbx.on svg { width:12px; height:12px; color:#fff; }
  .rd { width:18px; height:18px; border-radius:50%; border:1.5px solid var(--border-strong); display:flex; align-items:center; justify-content:center; }
  .rd.on { border-color:var(--brand); border-width:5px; }
  .tg { width:38px; height:22px; border-radius:999px; background:var(--neutral-30); position:relative; transition:all .2s; }
  .tg.on { background:var(--brand); }
  .tg span { position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; box-shadow:var(--shadow-1); transition:all .2s; }
  .tg.on span { left:18px; }
  .seg { display:inline-flex; background:var(--bg-inset); border-radius:8px; padding:3px; }
  .seg button { border:none; background:none; padding:6px 13px; border-radius:6px; font-size:12px; font-weight:500; color:var(--text-secondary); font-family:var(--font-sans); }
  .seg .active { background:#fff; color:var(--ink-100); box-shadow:var(--shadow-1); font-weight:600; }
  .sel { display:flex; align-items:center; justify-content:space-between; gap:10px; background:#fff; border:1px solid var(--border-strong); border-radius:8px; padding:8px 12px; font-size:13px; color:var(--ink-90); width:170px; }
  .sel svg { width:15px; height:15px; color:var(--text-muted); }
</style></head>
<body>
  <div class="cap" style="margin-bottom:14px;">Selection controls</div>
  <div class="grp">
    <div class="col2">
      <div class="opt"><span class="cbx on"><i data-lucide="check"></i></span>APA</div>
      <div class="opt"><span class="cbx"></span>IEEE</div>
      <div class="opt"><span class="rd on"></span>Revisión automática</div>
      <div class="opt"><span class="rd"></span>Revisión manual</div>
    </div>
    <div class="col2">
      <div class="opt"><span class="tg on"><span></span></span>RAG privado</div>
      <div class="opt"><span class="tg"><span></span></span>Fuentes externas</div>
      <div class="seg"><button class="active">Todos</button><button>Borradores</button><button>Publicados</button></div>
      <div class="sel">Formato: APA <i data-lucide="chevron-down"></i></div>
    </div>
  </div>
  <script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.min.js"></script><script>lucide.createIcons();</script>
</body></html>
