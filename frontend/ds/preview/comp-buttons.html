<!DOCTYPE html>
<!-- @dsCard group="Components" name="Buttons" subtitle="Primary / secondary / ghost / accent / danger" viewport="700x195" --><html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>
  .btn { display:inline-flex; align-items:center; gap:7px; font-family:var(--font-sans); font-size:13px; font-weight:600; border-radius:8px; padding:9px 16px; cursor:pointer; border:1px solid transparent; transition:all var(--dur-base); }
  .btn svg { width:15px; height:15px; }
  .primary { background:var(--blue-60); color:#fff; box-shadow:var(--shadow-brand); }
  .secondary { background:#fff; color:var(--ink-90); border-color:var(--border-strong); }
  .ghost { background:transparent; color:var(--text-secondary); }
  .accent { background:var(--violet-60); color:#fff; }
  .danger { background:var(--red-05); color:var(--red-60); border-color:#f6d2ce; }
  .sm { padding:5px 12px; font-size:12px; }
  .row + .row { margin-top:12px; }
</style></head>
<body>
  <div class="cap" style="margin-bottom:14px;">Buttons</div>
  <div class="row">
    <button class="btn primary"><i data-lucide="play"></i>Run pipeline</button>
    <button class="btn secondary"><i data-lucide="save"></i>Save</button>
    <button class="btn ghost"><i data-lucide="settings"></i>Settings</button>
    <button class="btn accent"><i data-lucide="sparkles"></i>Ask AI</button>
  </div>
  <div class="row">
    <button class="btn danger sm"><i data-lucide="x"></i>Reject</button>
    <button class="btn primary sm">Approve</button>
    <button class="btn secondary sm">Cancel</button>
    <span class="lbl">Default · hover darkens one step · active darkens two · focus = 3px blue ring</span>
  </div>
  <script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.min.js"></script>
  <script>lucide.createIcons();</script>
</body></html>
