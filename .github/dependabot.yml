# Actualización automática de dependencias (SPEC-020 / T6.2 / AC2).
#
# Tres ecosistemas, porque los tres pueden traer código de terceros a un
# despliegue: el backend, el frontend y las propias GitHub Actions —que corren con
# acceso al repositorio y suelen olvidarse.
#
# Las PR de Dependabot pasan por el mismo gate de CI que cualquier otra: los tests,
# los builds y el job `deps-audit`. En el backend, además, tocan `requirements.txt`,
# que es el lock con hashes: si Dependabot no puede regenerarlo de forma coherente,
# la PR falla en la instalación en lugar de colar una versión sin verificar.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["area/governance", "dependencies"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Un PR por lote para el ruido de siempre; las de seguridad vienen aparte
      # y con su propio aviso, así que no se pierden dentro del grupo.
      backend-minor-y-parches:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["area/governance", "dependencies"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend-minor-y-parches:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ["area/governance", "dependencies"]
    commit-message:
      prefix: "chore(deps)"
