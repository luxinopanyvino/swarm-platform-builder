# Configuración de nginx para la SPA (SPEC-017/T3.3).
#
# Fichero de verdad en lugar del `RUN echo '...' >` que había: aquel se escribía
# como root en tiempo de build —imposible con una imagen sin privilegios— y era
# ilegible. Además, T3.4 (#166) tiene que añadir aquí cabeceras de seguridad y CSP,
# y hacerlo sobre una cadena con barras invertidas habría sido pedir un error.
server {
    # 8080 y no 80: los puertos por debajo de 1024 exigen privilegios que este
    # contenedor ya no tiene. El compose publica 8080:8080.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        # React Router: cualquier ruta desconocida la resuelve la SPA.
        try_files $uri $uri/ /index.html;
    }
}
