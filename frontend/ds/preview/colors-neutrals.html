<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Cloud neutrals & ink" subtitle="SLDS-derived surface ramp" viewport="700x180" --><html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>
  .ramp { display: grid; grid-template-columns: repeat(10, 1fr); border-radius: 10px; overflow: hidden; border: 1px solid var(--border-default); }
  .sw { height: 58px; display:flex; align-items:flex-end; padding:5px; }
  .sw span { font-family: var(--font-mono); font-size: 9px; }
  .note { margin-top:14px; font-size:12px; color:var(--text-secondary); }
</style></head>
<body>
  <div class="cap" style="margin-bottom:12px;">Cloud neutrals + ink · SLDS-derived</div>
  <div class="ramp">
    <div class="sw" style="background:#ffffff; border-right:1px solid var(--border-subtle);"><span style="color:#0b1b33;">00</span></div>
    <div class="sw" style="background:#f8fafc;"><span style="color:#0b1b33;">05</span></div>
    <div class="sw" style="background:#f4f6f9;"><span style="color:#0b1b33;">10</span></div>
    <div class="sw" style="background:#eef1f6;"><span style="color:#0b1b33;">15</span></div>
    <div class="sw" style="background:#e0e5ee;"><span style="color:#0b1b33;">20</span></div>
    <div class="sw" style="background:#d8dde6;"><span style="color:#0b1b33;">30</span></div>
    <div class="sw" style="background:#aab2c2;"><span style="color:#0b1b33;">50</span></div>
    <div class="sw" style="background:#5c6b7e;"><span style="color:#fff;">70</span></div>
    <div class="sw" style="background:#2e3a4d;"><span style="color:#fff;">90</span></div>
    <div class="sw" style="background:#0b1b33;"><span style="color:#fff;">ink</span></div>
  </div>
  <div class="note">Canvas <span class="mono">#F4F6F9</span> · surfaces <span class="mono">#FFFFFF</span> · borders <span class="mono">#E0E5EE</span> · body <span class="mono">#2E3A4D</span> · headings <span class="mono">#0B1B33</span></div>
</body></html>
