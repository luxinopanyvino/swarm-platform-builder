<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>
  .charts { display:grid; grid-template-columns:1.1fr 1.1fr 0.85fr; gap:20px; align-items:center; }
  .ct { font-size:10px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--text-muted); margin-bottom:8px; }
  text { font-family:var(--font-sans); }
</style></head>
<body>
  <div class="cap" style="margin-bottom:12px;">Charts · bar · area-line · donut</div>
  <div class="charts">
    <div><div class="ct">Artículos / mes</div>
      <svg width="100%" viewBox="0 0 220 120">
        <line x1="6" y1="100" x2="214" y2="100" stroke="var(--viz-axis)" stroke-width="1"/>
        <rect x="14" y="52" width="26" height="48" rx="3" fill="var(--viz-1)"/>
        <rect x="54" y="36" width="26" height="64" rx="3" fill="var(--viz-1)"/>
        <rect x="94" y="60" width="26" height="40" rx="3" fill="var(--viz-1)"/>
        <rect x="134" y="22" width="26" height="78" rx="3" fill="var(--viz-1)"/>
        <rect x="174" y="44" width="26" height="56" rx="3" fill="var(--viz-7)"/>
      </svg>
    </div>
    <div><div class="ct">Approval score</div>
      <svg width="100%" viewBox="0 0 220 120">
        <g stroke="var(--viz-grid)" stroke-width="1"><line x1="6" y1="30" x2="214" y2="30"/><line x1="6" y1="65" x2="214" y2="65"/><line x1="6" y1="100" x2="214" y2="100"/></g>
        <polygon fill="var(--viz-3)" opacity="0.10" points="10,82 55,60 100,68 145,38 200,26 200,100 10,100"/>
        <polyline fill="none" stroke="var(--viz-3)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="10,82 55,60 100,68 145,38 200,26"/>
        <g fill="var(--viz-3)"><circle cx="10" cy="82" r="3"/><circle cx="55" cy="60" r="3"/><circle cx="100" cy="68" r="3"/><circle cx="145" cy="38" r="3"/><circle cx="200" cy="26" r="3.5"/></g>
      </svg>
    </div>
    <div><div class="ct">Por estado</div>
      <svg width="100%" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="42" fill="none" stroke="var(--viz-track)" stroke-width="16"/>
        <circle cx="60" cy="60" r="42" fill="none" stroke="var(--viz-5)" stroke-width="16" stroke-dasharray="119 264" transform="rotate(-90 60 60)"/>
        <circle cx="60" cy="60" r="42" fill="none" stroke="var(--viz-4)" stroke-width="16" stroke-dasharray="66 264" stroke-dashoffset="-119" transform="rotate(-90 60 60)"/>
        <circle cx="60" cy="60" r="42" fill="none" stroke="var(--viz-1)" stroke-width="16" stroke-dasharray="53 264" stroke-dashoffset="-185" transform="rotate(-90 60 60)"/>
        <text x="60" y="58" text-anchor="middle" font-size="20" font-weight="700" fill="var(--text-heading)">62</text>
        <text x="60" y="73" text-anchor="middle" font-size="9" fill="var(--text-muted)">total</text>
      </svg>
    </div>
  </div>
</body></html>
