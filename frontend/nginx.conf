# Configuración de nginx para la SPA (SPEC-017/T3.3 y T3.4).
#
# Fichero de verdad en lugar del `RUN echo '...' >` que había: aquel se escribía
# como root en tiempo de build —imposible con una imagen sin privilegios— y era
# ilegible justo donde ahora viven las cabeceras de seguridad.
#
# Esta es la variante **HTTP**, la que usa el compose de desarrollo. La de
# producción (`nginx.prod.conf`) añade TLS, la redirección y HSTS.

# ── Cabeceras de seguridad y CSP (SPEC-017/AC4) ──────────────────────────────
# En un fichero aparte porque las dos configuraciones —dev y prod— tienen que
# aplicar exactamente las mismas: una CSP que solo se prueba en producción es una
# CSP que se descubre rota en producción.
include /etc/nginx/conf.d/security-headers.inc;

server {
    # 8080 y no 80: los puertos por debajo de 1024 exigen privilegios que este
    # contenedor ya no tiene (T3.3). El compose publica 8080:8080.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # ── API: mismo origen ────────────────────────────────────────────────────
    # El frontend llama con rutas relativas (`VITE_API_URL` vacío) y nginx hace de
    # pasarela. Así no hay CORS que configurar, la CSP puede ser `connect-src
    # 'self'` —lo más estricto posible— y en producción el tráfico de API viaja por
    # el mismo TLS que la aplicación, sin necesidad de un segundo certificado.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El backend correlaciona por esta cabecera (SPEC-019/T5.1); si el cliente
        # no la manda, se propaga el id de petición de nginx.
        proxy_set_header X-Request-ID $request_id;

        # SSE: el pipeline emite eventos por streaming. Sin desactivar el búfer,
        # nginx los acumula y la ejecución parece congelada hasta que termina.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
        access_log off;
    }

    location / {
        # React Router: cualquier ruta desconocida la resuelve la SPA.
        try_files $uri $uri/ /index.html;
    }
}
