<!DOCTYPE html>
<!-- @dsCard group="Type" name="UI type scale" subtitle="Source Sans 3 — product interface" viewport="700x235" --><html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>
  .spec { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 9px 18px; }
  .spec .t { font-family: var(--font-sans); color: var(--ink-90); line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spec .m { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); text-align: right; white-space: nowrap; }
</style></head>
<body>
  <div class="cap" style="margin-bottom:14px;">Source Sans 3 · Product UI</div>
  <div class="spec">
    <div class="t" style="font-size:24px; font-weight:600;">Workspace title</div><div class="m">24 / 600</div>
    <div class="t" style="font-size:18px; font-weight:600;">Panel heading</div><div class="m">18 / 600</div>
    <div class="t" style="font-size:14px; font-weight:400;">Body & controls — the default UI text size</div><div class="m">14 / 400</div>
    <div class="t" style="font-size:13px; font-weight:500; color:var(--text-secondary);">Label · metadata</div><div class="m">13 / 500</div>
    <div class="t cap" style="font-size:11px;">Eyebrow / overline</div><div class="m">11 / 600</div>
  </div>
</body></html>
