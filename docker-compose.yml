name: alejandria-magazine

networks:
  alejandria_network:
    driver: bridge

services:
  # ─────────────────────────────────────────
  # Relational DB
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: alejandria_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # Injected from the environment (.env / secrets store) — never commit a
      # value. Must match the password used in the backend's DATABASE_URL.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your environment}"
      POSTGRES_DB: alejandria
    # Internal-only: not published to the host (reachable on alejandria_network).
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - alejandria_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alejandria"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Límite de recursos (SPEC-017/AC5). Datos relacionales: el pico real es el pool de conexiones.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # ─────────────────────────────────────────
  # Vector DB (RAG)
  # ─────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: alejandria_qdrant
    restart: unless-stopped
    environment:
      # Require an API key on every request. Injected from the environment —
      # never commit a value. Must match the backend's QDRANT_API_KEY.
      QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY:?set QDRANT_API_KEY in your environment}"
    # Internal-only: no host ports published (reachable on alejandria_network).
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - alejandria_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Límite de recursos (SPEC-017/AC5). Mantiene los vectores en memoria; el techo crece con el corpus RAG.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G

  # ─────────────────────────────────────────
  # LLM inference (Ollama)
  # ─────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: alejandria_ollama
    restart: unless-stopped
    # Internal-only: not published to the host (reachable on alejandria_network).
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - alejandria_network
    # Pull all required models on first start.
    # Order: embed model first (small/fast), then generation models largest → smallest.
    entrypoint: >
      sh -c "ollama serve &
             sleep 8 &&
             ollama pull nomic-embed-text &&
             ollama pull llama3.2:1b &&
             ollama pull llama3.2:3b &&
             ollama pull mistral:7b &&
             wait"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s  # allow time for model downloads on first run
    # Límite de recursos (SPEC-017/AC5). El más goloso: un modelo de 7B no cabe por debajo de ~6G. Es el
    # primer límite a subir si el pipeline se queda sin memoria.
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G

  # ─────────────────────────────────────────
  # Coordinación entre workers (SPEC-018/T4.3)
  # ─────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: alejandria_redis
    restart: unless-stopped
    # Interno: sin puertos publicados (solo alejandria_network).
    # Sin persistencia a propósito: aquí solo viven eventos en vuelo, decisiones
    # pendientes y tickets de segundos. Nada que sobreviva a un reinicio, y guardar
    # en disco solo añadiría E/S y una copia de datos efímeros.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - alejandria_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Límite de recursos (SPEC-017/AC5). Solo mensajes en vuelo: no necesita más.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ─────────────────────────────────────────
  # Backend (FastAPI + LangGraph)
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alejandria_backend
    restart: unless-stopped
    environment:
      # ── Aplicación ──────────────────────────────────────────
      DEBUG: "false"
      # ── Base de datos ────────────────────────────────────────
      # Built from POSTGRES_PASSWORD so the credential lives only in the
      # environment, never inline in git.
      DATABASE_URL: "postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your environment}@postgres:5432/alejandria"
      # ── Seguridad JWT ────────────────────────────────────────
      # Injected from the environment; never commit a value. Rotate by changing
      # the env var and restarting. Generate with: openssl rand -hex 32
      SECRET_KEY: "${SECRET_KEY:?set SECRET_KEY (openssl rand -hex 32) in your environment}"
      # ── Acceso ──────────────────────────────────────────────
      ENABLE_DEV_ROLE_PROMOTION: "false"
      # ── Ollama ──────────────────────────────────────────────
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_MODEL: "mistral:7b"
      OLLAMA_EMBED_MODEL: "nomic-embed-text"
      # ── Qdrant ──────────────────────────────────────────────
      QDRANT_URL: "http://qdrant:6333"
      # Must match the qdrant service's QDRANT__SERVICE__API_KEY. Injected from
      # the environment; never commit a value.
      QDRANT_API_KEY: "${QDRANT_API_KEY:?set QDRANT_API_KEY in your environment}"
      QDRANT_COLLECTION: "rag_docs"
      # ── Coordinación entre workers (SPEC-018/T4.3) ──────────
      REDIS_URL: "redis://redis:6379/0"
      # En desarrollo se deja apagado: con un worker el bus en proceso basta.
      # El override de producción lo enciende.
      REDIS_ENABLED: "false"
      # ── CORS ────────────────────────────────────────────────
      ALLOWED_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        # Tenía healthcheck pero se esperaba solo a que arrancara: el backend podía
        # empezar a atender con Qdrant todavía sin responder.
        condition: service_healthy
      ollama:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Mount source for hot-reload in dev; remove in production image builds
      - ./backend:/app
      - ./config.yaml:/app/config.yaml:ro
      # Rutas que la aplicación escribe. Como volúmenes nombrados y no dentro del
      # bind mount: heredan el propietario del directorio de la imagen (usuario
      # `app`), mientras que el bind mount trae los permisos del host y el proceso
      # sin privilegios no podría escribir en él.
      - rag_local_data:/app/app/.rag_local
      - assets_data:/app/app/.assets
      - backend_logs:/app/logs
    ports:
      - "8000:8000"
    networks:
      - alejandria_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    # Readiness, no liveness (SPEC-017/AC5 + SPEC-019/AC4): el contenedor solo se
    # marca sano cuando además de vivir puede atender tráfico útil —base de datos,
    # Qdrant y proveedor de LLM alcanzables—, así que `depends_on: service_healthy`
    # de otros servicios significa algo de verdad.
    #
    # Se sondea con Python y no con wget/curl: es lo único que la imagen garantiza
    # tener, y T3.3 (#165) va a quitar el toolchain de la imagen final.
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 15s
      timeout: 10s
      retries: 5
      # Margen para migraciones y seeding en el primer arranque.
      start_period: 60s
    # Límite de recursos (SPEC-017/AC5). Suficiente para uvicorn y el grafo; no carga modelos en proceso.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  # ─────────────────────────────────────────
  # Frontend (React + Vite → Nginx)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Vacío ⇒ rutas relativas: el cliente llama a /api/... y nginx hace de
        # pasarela hacia el backend (T3.4). Sin origen cruzado no hay CORS que
        # configurar y la CSP puede quedarse en `connect-src 'self'`.
        - VITE_API_URL=
    container_name: alejandria_frontend
    restart: unless-stopped
    depends_on:
      - backend
    # 8080 dentro del contenedor: nginx corre sin privilegios y no puede abrir el 80.
    ports:
      - "8080:8080"
    networks:
      - alejandria_network
    # Límite de recursos (SPEC-017/AC5). Solo sirve estáticos con nginx.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    # Readiness: nginx responde el index. wget viene en busybox (nginx:alpine).
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local
  ollama_data:
    driver: local
  rag_local_data:
    driver: local
  assets_data:
    driver: local
  backend_logs:
    driver: local
