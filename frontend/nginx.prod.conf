# Configuración de nginx para producción: TLS + redirección (SPEC-017/T3.4/AC4).
#
# Sustituye a `nginx.conf` (se monta encima) cuando se levanta con
# `docker-compose.prod.yml`. Comparte las cabeceras y la CSP con la de desarrollo
# a través del mismo `security-headers.inc`: una CSP que solo se aplica en
# producción es una CSP que se descubre rota en producción.

include /etc/nginx/conf.d/security-headers.inc;

# HTTP: solo existe para mandar a la gente a HTTPS.
server {
    listen 8080;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    # 8443 y no 443: el proceso corre sin privilegios (T3.3) y no puede abrir un
    # puerto por debajo de 1024. El compose publica 443:8443.
    listen 8443 ssl;
    http2 on;
    server_name _;

    # Certificado y clave los aporta el operador (volumen del compose). Para
    # probar en local, ver docs/guide/tls-local.md.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Solo TLS 1.2+ y suites con forward secrecy.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS: solo aquí, nunca en la variante HTTP de desarrollo. Enviarla sin TLS
    # dejaría el navegador incapaz de volver a abrir el sitio en local.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # `add_header` no se hereda cuando un nivel inferior define el suyo, así que
    # hay que repetir las comunes junto a la de HSTS.
    include /etc/nginx/conf.d/security-headers.inc;

    root /usr/share/nginx/html;
    index index.html index.htm;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # SSE: sin esto los eventos del pipeline se quedan en el búfer de nginx.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
