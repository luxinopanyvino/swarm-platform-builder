<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Spacing scale" subtitle="4px base — SLDS rem aliases" viewport="700x245" --><html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>
  .scale { display:flex; flex-direction:column; gap:9px; }
  .s-row { display:flex; align-items:center; gap:14px; }
  .bar { background:var(--blue-60); height:14px; border-radius:3px; }
  .name { width:120px; font-size:12px; color:var(--text-secondary); }
  .px { font-family:var(--font-mono); font-size:11px; color:var(--text-muted); width:54px; text-align:right; }
</style></head>
<body>
  <div class="cap" style="margin-bottom:14px;">Spacing scale · 4px base (SLDS rem aliases)</div>
  <div class="scale">
    <div class="s-row"><span class="name">2xs</span><span class="px">4px</span><span class="bar" style="width:4px;"></span></div>
    <div class="s-row"><span class="name">xs</span><span class="px">8px</span><span class="bar" style="width:8px;"></span></div>
    <div class="s-row"><span class="name">sm</span><span class="px">12px</span><span class="bar" style="width:12px;"></span></div>
    <div class="s-row"><span class="name">md</span><span class="px">16px</span><span class="bar" style="width:16px;"></span></div>
    <div class="s-row"><span class="name">lg</span><span class="px">24px</span><span class="bar" style="width:24px;"></span></div>
    <div class="s-row"><span class="name">xl</span><span class="px">32px</span><span class="bar" style="width:32px;"></span></div>
    <div class="s-row"><span class="name">2xl</span><span class="px">48px</span><span class="bar" style="width:48px;"></span></div>
    <div class="s-row"><span class="name">3xl</span><span class="px">64px</span><span class="bar" style="width:64px;"></span></div>
  </div>
</body></html>
